# Приднестровье - исключаемые регионы и города
# Граница: левый берег Днестра

# Прямоугольник, покрывающий Приднестровье (bbox: min_lon, min_lat, max_lon, max_lat)
# Приднестровье примерно: 28.8-30.2°E, 46.5-47.8°N
excluded_bbox:
  min_lon: 28.8
  min_lat: 46.5
  max_lon: 30.2
  max_lat: 47.8

# Города Приднестровья для фильтрации по адресу
excluded_cities:
  - "тирасполь"
  - "tyraspol"
  - "tiraspol"
  - "бендеры"
  - "bender"
  - "tighina"
  - "тигина"
  - "рыбница"
  - "ribnita"
  - "rîbnița"
  - "слободзея"
  - "slobozia"
  - "григориополь"
  - "grigoriopol"
  - "каменка"
  - "camenca"
  - "кам'янка"

# Дубоссарский район - левобережные сёла
